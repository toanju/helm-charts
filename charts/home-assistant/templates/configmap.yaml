apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "home-assistant.fullname" . }}
  labels:
    {{- include "home-assistant.labels" . | nindent 4 }}
data:
  configuration.yaml: |
    {{- $fname := "" }}
    {{- if .Values.ha.includeDefaultConfig }}
    default_config:
    {{- end }}
    {{- range .Values.ha.extraConfigFiles }}
    {{- if .key }}
    {{- $fname = printf "%s.yaml" .key }}
    {{- else }}
    {{- $fname = .filename }}
    {{- end }}
    {{- if .key }}
    {{ .key }}: !include {{ $fname }}
    {{- end }}
    {{- end }}
    {{- if .Values.ha.config }}
    {{- .Values.ha.config | nindent 4 }}
    {{- end }}
    {{- if .Values.ha.recorder.enabled }}
    recorder: !include recorder.yaml
    {{- end }}
  {{- range .Values.ha.extraConfigFiles }}
  {{- if .key }}
  {{- $fname = printf "%s.yaml" .key }}
  {{- else }}
  {{- $fname = .filename }}
  {{- end }}
  {{ $fname }}: |
    {{- if .template }}
    {{- tpl .content $ | nindent 4 }}
    {{- else }}
    {{- .content | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if and .Values.ha.recorder.enabled (not .Values.ha.recorder.externalSecret) }}
  recorder.yaml: |
    {{- if .Values.ha.recorder.dbUrl }}
    db_url: {{ tpl .Values.ha.recorder.dbUrl . | quote }}
    {{- end }}
    {{- if .Values.ha.recorder.config }}
    {{- toYaml .Values.ha.recorder.config | nindent 4 }}
    {{- end }}
  {{- end }}
