apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "home-assistant.fullname" . }}-test-connection"
  labels:
    {{- include "home-assistant.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command:
      - sh
      args:
      - "-c"
      - |
        wget '{{ include "home-assistant.fullname" . }}:80' && cat index.html
  restartPolicy: Never
